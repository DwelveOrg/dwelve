name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: marketing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No env: this site has no backend client and no session code — both moved
    # to DwelveOrg/app with the split. The build must keep passing without any
    # API or secret configuration; if a step ever needs one again, something
    # application-shaped has been added to the marketing repo by mistake.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run check:contrast
      - run: npm run build
      - run: npm audit --audit-level=high
